<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline · Milestone College</title>
    <style>
      :root { color-scheme: light dark; }
      html,body{margin:0;height:100%;background:#1e3a5f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;}
      .wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;}
      img{width:96px;height:96px;object-fit:contain;padding:16px;border-radius:24px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);}
      h1{font-size:22px;margin:24px 0 8px;letter-spacing:.02em;}
      p{opacity:.78;font-size:14px;max-width:32ch;line-height:1.5;margin:0 0 20px;}
      button{appearance:none;border:0;padding:12px 22px;border-radius:999px;background:#d4af37;color:#1e3a5f;font-weight:600;font-size:14px;cursor:pointer;}
      .small{margin-top:16px;font-size:12px;opacity:.55;letter-spacing:.18em;text-transform:uppercase;}
    </style>
  </head>
  <body>
    <div class="wrap">
      <img src="/logo.png" alt="Milestone College" />
      <h1>You're offline</h1>
      <p>We couldn't reach the network. Previously visited pages may still work — or try again once you're back online.</p>
      <button onclick="location.reload()">Try again</button>
      <div class="small">Milestone College</div>
    </div>
  </body>
</html>
