<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Milestone International College</title>
    <meta name="description" content="Milestone International College - Premier +2 college offering Science, Management, and Law faculties for Class 11-12. Admissions open for year 2083.">
    <meta name="author" content="Milestone International College" />
    
    <!-- PWA Meta Tags (manifest injected by vite-plugin-pwa) -->
    <meta name="theme-color" content="#1e3a5f" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Milestone College" />
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="shortcut icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    
    <!-- Mobile optimization -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Social -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://storage.googleapis.com/gpt-engineer-file-uploads/sHS3vJlsjIbkxFe1J0DyMswYbrW2/social-images/social-1774542942604-logo.webp">
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@MilestoneCollege" />
    <meta name="twitter:image" content="https://storage.googleapis.com/gpt-engineer-file-uploads/sHS3vJlsjIbkxFe1J0DyMswYbrW2/social-images/social-1774542942604-logo.webp">
    
    
    
    
    <style>
      /* Branded preloader shown instantly in PWA standalone mode so iOS
         never flashes the previous page (e.g. the principal photo) while
         React boots. Hidden as soon as the React app mounts. */
      @media (display-mode: standalone) {
        html, body { background: #1e3a5f; }
        #pwa-preloader {
          position: fixed; inset: 0; z-index: 99999;
          display: flex; flex-direction: column; align-items: center; justify-content: center;
          background: #1e3a5f;
          color: #fff;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        }
        #pwa-preloader img { width: 88px; height: 88px; object-fit: contain;
          padding: 14px; border-radius: 22px;
          background: rgba(255,255,255,0.08);
          border: 1px solid rgba(255,255,255,0.18);
        }
        #pwa-preloader .t { margin-top: 18px; font-size: 14px; letter-spacing: 0.18em; text-transform: uppercase; opacity: .75; }
      }
      @media not all and (display-mode: standalone) { #pwa-preloader { display: none !important; } }
    </style>
    <meta property="og:title" content="Milestone International College">
  <meta name="twitter:title" content="Milestone International College">
  <meta property="og:description" content="Milestone International College - Premier +2 college offering Science, Management, and Law faculties for Class 11-12. Admissions open for year 2083.">
  <meta name="twitter:description" content="Milestone International College - Premier +2 college offering Science, Management, and Law faculties for Class 11-12. Admissions open for year 2083.">
</head>
  <body>
    <div id="pwa-preloader" aria-hidden="true">
      <img src="/logo.png" alt="" />
      <div class="t">Milestone College</div>
    </div>
    <div id="root"></div>
    <script>
      // Remove preloader once React paints
      window.addEventListener('load', function () {
        setTimeout(function () {
          var el = document.getElementById('pwa-preloader');
          if (el) el.parentNode.removeChild(el);
        }, 400);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
